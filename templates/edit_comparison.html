{% extends "base.html" %}

{% block title %}Edit Comparison{% endblock %}

{% block content %}
<h3>Edit Comparison</h3>
<form method="post">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ comparison.name }}">
    </div>
    <div class="form-group">
        <label for="ticker">Ticker</label>
        <input type="text" class="form-control" id="ticker" name="ticker" value="{{ comparison.ticker[:-3] }}">
    </div>
    <div class="form-group">
        <label for="start_date">Start Date</label>
        <input type="text" class="form-control datepicker" id="start_date" name="start_date" value="{{ comparison.start_date }}">
    </div>
    <div class="form-group">
        <label for="end_date">End Date</label>
        <input type="text" class="form-control datepicker" id="end_date" name="end_date" value="{{ comparison.end_date }}">
    </div>
    <div class="form-group">
        <label for="model">Model</label>
        <select class="form-control" id="model" name="model">
            <option value="LinearRegression" {% if comparison.model == "LinearRegression" %}selected{% endif %}>Linear Regression</option>
            <option value="LSTM" {% if comparison.model == "LSTM" %}selected{% endif %}>LSTM</option>
            <option value="RNN" {% if comparison.model == "RNN" %}selected{% endif %}>RNN</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
