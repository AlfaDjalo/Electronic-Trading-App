{% extends "base.html" %}

{% block title %}Edit Comparison{% endblock %}

{% block content %}
<h3>Edit Comparison</h3>
<form method="post">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ comparison.name }}">
    </div>
    <div class="form-group">
        <label for="model">Model</label>
        <select class="form-control" id="model" name="model">
            <option value="LinearRegression" {% if comparison.model == "LinearRegression" %}selected{% endif %}>Linear Regression</option>
            <option value="LSTM" {% if comparison.model == "LSTM" %}selected{% endif %}>LSTM</option>
            <option value="RNN" {% if comparison.model == "RNN" %}selected{% endif %}>RNN</option>
        </select>
    </div>
    <div class="form-group">
        <label for="feature_set">Feature Set</label>
        <select class="form-control" id="feature_set" name="feature_set">
            {% for name, feature_set in feature_sets.items() %}
                {% if feature_set.data_type == data_type %}
                <option value="{{ name }}" {% if name == comparison.feature_set %}selected{% endif %}>{{ name }}</option>
                {% endif %}
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="normalise">Normalise</label>
        <input type="checkbox" id="normalise" name="normalise" {% if comparison.normalise %}checked{% endif %}>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <button type="submit" name="cancel" class="btn btn-secondary">Cancel</button>
</form>
{% endblock %}
