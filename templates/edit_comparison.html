{% extends "base.html" %}

{% block title %}Edit Comparison{% endblock %}

{% block content %}
<h3>Edit Comparison</h3>
<form method="post">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ comparison.name }}">
    </div>
    <div class="form-group">
        <label for="model">Model</label>
        <select class="form-control" id="model" name="model">
            <option value="LinearRegression" {% if comparison.model == "LinearRegression" %}selected{% endif %}>Linear Regression</option>
            <option value="LSTM" {% if comparison.model == "LSTM" %}selected{% endif %}>LSTM</option>
            <option value="RNN" {% if comparison.model == "RNN" %}selected{% endif %}>RNN</option>
        </select>
    </div>
    <div class="form-group">
        <label for="lag_period">Lag Period</label>
        <input type="number" class="form-control" id="lag_period" name="lag_period" min="0" value="{{ comparison.lag_period or DEFAULT_LAG_PERIOD }}">
    </div>
    <div class="form-group">
        <label for="forecast_period">Forecast Period</label>
        <input type="number" class="form-control" id="forecast_period" name="forecast_period" min="0" value="{{ comparison.forecast_period or DEFAULT_FORECAST_PERIOD }}">
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <button type="submit" name="cancel" class="btn btn-secondary">Cancel</button>
</form>
{% endblock %}
