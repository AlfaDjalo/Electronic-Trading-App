{% extends "base.html" %}

{% block title %}Select Algorithm{% endblock %}

{% block content %}
<form action="/run_algorithm" method="post">
    <div class="form-group">
        <label for="algorithm">Select Algorithm</label>
        <select class="form-control" id="algorithm" name="algorithm">
            <option value="regression">Regression</option>
            <option value="regression_on_trend">Regression on trend</option>
            <option value="ml_regression">ML Regression</option>            
            <option value="stats_tests">Stats Tests</option>
            <!-- Add more algorithms here -->
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Run Algorithm</button>
</form>
{% endblock %}
