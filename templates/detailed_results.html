{% extends "base.html" %}

{% block title %}Detailed Results{% endblock %}

{% block content %}
<h3>Detailed Results for {{ comparison.ticker }} - {{ comparison.model }}</h3>

<h4>Prediction vs Actual Chart</h4>
<img src="{{ prediction_chart_url }}" alt="Prediction Chart" class="img-fluid">

<h4>Error Chart</h4>
<img src="{{ error_chart_url }}" alt="Error Chart" class="img-fluid">

<a href="{{ url_for('comparison_results') }}" class="btn btn-primary">Back to Comparison Results</a>
{% endblock %}
