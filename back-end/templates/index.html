{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<h3>Welcome to the Trading App</h3>

<form method="post" action="{{ url_for('set_ticker_and_dates') }}">
    <div class="form-group">
        <label for="category">Select Category</label>
        <select class="form-control" id="category" name="category">
            <option value="australian" {% if category == "australian" %}selected{% endif %}>Australian Stocks</option>
            <option value="us" {% if category == "us" %}selected{% endif %}>US Stocks</option>
            <option value="fx" {% if category == "fx" %}selected{% endif %}>Forex</option>
            <option value="crypto" {% if category == "crypto" %}selected{% endif %}>Cryptocurrency</option>
            <option value="test" {% if category == "test" %}selected{% endif %}>Test</option>
        </select>
    </div>
    <div class="form-group">
        <label for="ticker">Select Ticker</label>
        <select class="form-control" id="ticker" name="ticker">
            {% for ticker in tickers %}
            <option value="{{ ticker.Code }}" {% if session_ticker == ticker.Code %}selected{% endif %}>
                {{ ticker.Company }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="start_date">Start Date</label>
        <input type="text" class="form-control datepicker" id="start_date" name="start_date" value="{{ session_start_date if session_start_date else 'YYYY-MM-DD' }}">
    </div>
    <div class="form-group">
        <label for="end_date">End Date</label>
        <input type="text" class="form-control datepicker" id="end_date" name="end_date" value="{{ session_end_date if session_end_date else 'YYYY-MM-DD' }}">
    </div>
    <div class="form-group" id="lob-data-group" style="display: none;">
        <input type="checkbox" id="use_lob_data" name="use_lob_data" {% if session.use_lob_data %}checked{% endif %}>
        <label for="use_lob_data">Include LOB Data</label>
    </div>
    <button type="submit" class="btn btn-primary mt-2">Save</button>
</form>

<script>
    document.getElementById('category').addEventListener('change', function () {
        const category = this.value;
        const lobDataGroup = document.getElementById('lob-data-group');
        if (category === 'crypto') {
            lobDataGroup.style.display = 'block';
        } else {
            lobDataGroup.style.display = 'none';
        }

        fetch(`/get_tickers/${category}`)
            .then(response => response.json())
            .then(data => {
                const tickerSelect = document.getElementById('ticker');
                tickerSelect.innerHTML = ''; // Clear existing options
                data.tickers.forEach(ticker => {
                    const option = document.createElement('option');
                    option.value = ticker.Code;
                    option.textContent = ticker.Company;
                    tickerSelect.appendChild(option);
                });
            })
            .catch(error => console.error('Error fetching tickers:', error));
    });

    // Trigger change event on page load to handle initial state
    document.getElementById('category').dispatchEvent(new Event('change'));
</script>
{% endblock %}
