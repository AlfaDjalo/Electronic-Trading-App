{% extends "base.html" %}

{% block title %}Add Feature Set{% endblock %}

{% block content %}
<h3>Add Feature Set</h3>
<form method="post">
    <div class="form-group">
        <label for="feature_set_name">Feature Set Name</label>
        <input type="text" class="form-control" id="feature_set_name" name="feature_set_name" required>
    </div>
    <div class="form-group">
        <label for="fields">Available Fields</label>
        <select class="form-control" id="fields" name="fields" multiple>
            {% for field in fields %}
            <option value="{{ field }}">{{ field }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="features">Features</label>
        <div id="features_container">
            <div class="feature">
                <label>Feature Name</label>
                <input type="text" class="form-control" name="features" required>
            </div>
        </div>
        <button type="button" class="btn btn-secondary mt-2" id="add_feature">Add Feature</button>
    </div>
    <button type="submit" class="btn btn-primary">Save Feature Set</button>
</form>
<a href="{{ url_for('comparison_page') }}" class="btn btn-secondary mt-3">Cancel</a>

<script>
    document.getElementById('add_feature').addEventListener('click', function () {
        const container = document.getElementById('features_container');
        const featureIndex = container.children.length;
        const featureHTML = `
            <div class="feature">
                <label>Feature Name</label>
                <input type="text" class="form-control" name="features[${featureIndex}][name]" required>
                <label>Input Data Fields</label>
                <select class="form-control" name="features[${featureIndex}][input_data_fields]" multiple required>
                    {% for field in fields %}
                    <option value="{{ field }}">{{ field }}</option>
                    {% endfor %}
                </select>
                <label>Function</label>
                <input type="text" class="form-control" name="features[${featureIndex}][function]" required>
                <button type="button" class="btn btn-danger mt-2 remove-feature">Remove</button>
            </div>
        `;
        const featureElement = document.createElement('div');
        featureElement.innerHTML = featureHTML;
        container.appendChild(featureElement);

        featureElement.querySelector('.remove-feature').addEventListener('click', function () {
            container.removeChild(featureElement);
        });
    });
</script>
{% endblock %}
